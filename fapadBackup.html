<script>
/* AJUSTES NO REPORTBUILDER */
function ajustarLarguras() { 
  document.querySelectorAll('#page-admin-reportbuilder-edit .generaltable thead tr th').forEach(function(el,i){
    const w = el.getBoundingClientRect().width + 1;
    document.querySelectorAll('#page-admin-reportbuilder-edit .generaltable tbody tr td.c'+i).forEach((ell) => { 
      ell.style.width = w+'px'; 
    });
  });
}

// executa logo de cara
ajustarLarguras();

// roda novamente depois que o DOM estiver totalmente pronto
window.addEventListener('load', ajustarLarguras);

// observa redimensionamento da janela
window.addEventListener('resize', ajustarLarguras);

// dispara manualmente a cada 500ms
const interval = setInterval(() => {
  ajustarLarguras();
}, 500);

/* FIM DOS AJUSTES NO REPORTBUILDER */
</script>
