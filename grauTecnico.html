<script>
   function importarPhosphorIcons() {
      const style = document.createElement("style");
      style.textContent = `
    @import url('https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css');
    @import url('https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css');
    @import url('https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css');
    @import url('https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css');
  `;
      document.head.appendChild(style);
   }
   importarPhosphorIcons();

   function protegerBlcIcones() {
      const iconesOriginais = {
         "Meus Cursos": { icon: "ph-book-open-text", bg: "#FFCC00" },
         "Biblioteca": { icon: "ph-book", bg: "#FF6900" },
         "Calendário": { icon: "ph-calendar-blank", bg: "#34529A" },
         "Notas": { icon: "ph-exam", bg: "#003C70" },
      };

      function restaurarIcones() {
         document.querySelectorAll('.cardPainel').forEach(card => {
            const label = card.querySelector('span')?.textContent?.trim();
            const iconeData = iconesOriginais[label];

            if (iconeData) {
               const blcIcone = card.querySelector('.blcIcone');
               if (blcIcone) {
                  const atualIcone = blcIcone.querySelector('i');
                  const correto = `<i class="ph ${iconeData.icon}" tabindex="-1"></i>`;
                  const precisaAtualizar = !atualIcone || atualIcone.className !== `ph ${iconeData.icon}`;

                  if (precisaAtualizar) {
                     blcIcone.innerHTML = correto;
                     blcIcone.style.backgroundColor = iconeData.bg;
                  }
               }
            }
         });
      }

      // Restaura inicialmente
      restaurarIcones();

      // Observa mudanças no body
      const observer = new MutationObserver(() => {
         restaurarIcones();
      });

      observer.observe(document.body, { childList: true, subtree: true });
   }

   // Ativar ao carregar a página
   window.addEventListener('DOMContentLoaded', protegerBlcIcones);

</script>
